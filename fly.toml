# fly.toml app configuration file generated for mdryshno on 2026-08-10T15:44:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mdryshno'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
